name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/publish.yml'
      - '.github/workflows/release-please.yml'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/publish.yml'
      - '.github/workflows/release-please.yml'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        field: [science, humanities]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: '^0.14.0'

      - name: Download fonts
        run: ./fonts/download-fonts.sh

      - name: Configure humanities variant
        if: matrix.field == 'humanities'
        run: |
          sed -i 's/^#let field = "science"/#let field = "humanities"/' template/main.typ
          grep -q '^#let field = "humanities"' template/main.typ

      - name: Compile thesis
        run: |
          typst compile template/main.typ thesis.pdf --root . --font-path ./fonts

      - name: Show log on failure
        if: failure()
        run: cat main.typ 2>/dev/null; echo "---"; ls -la thesis.pdf 2>/dev/null || true

      - name: Rename PDF
        if: success()
        run: mv thesis.pdf modern-tongji-thesis-${{ matrix.field }}.pdf

      - name: Upload PDF
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: document-${{ matrix.field }}
          path: modern-tongji-thesis-${{ matrix.field }}.pdf
          retention-days: 30

  # fontset "auto" chooses the Word template's fonts when SimSun is installed.
  # Downloads that set the way a writer does, compiles, and checks that the PDF
  # embeds SimSun and that the build reports no unknown font family.
  fonts-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: '^0.14.0'

      - name: Download fonts
        run: ./fonts/download-fonts.sh windows

      - name: Compile thesis
        run: |
          typst compile template/main.typ thesis.pdf --root . --font-path ./fonts 2> typst.log || { cat typst.log; exit 1; }
          cat typst.log

      - name: Check the fonts
        run: |
          if grep -q 'unknown font family' typst.log; then
            echo "::error::The build names a font family Typst did not find."
            exit 1
          fi
          command -v pdffonts > /dev/null || sudo apt-get install -y -qq poppler-utils
          pdffonts thesis.pdf
          for font in SimSun SimHei KaiTi FangSong; do
            pdffonts thesis.pdf | grep -q "$font" || { echo "::error::fontset auto did not choose the windows set: no $font in the PDF."; exit 1; }
          done
          # Nothing may fall back to the free set the script also downloads.
          if pdffonts thesis.pdf | grep -E 'LXGW|Zhuque|GBZenKai'; then
            echo "::error::Text fell back to a font of the free set."
            exit 1
          fi

  # blind: true must leave the sample student's name, student ID, advisor and
  # acknowledgements out of the PDF text and name no author in its metadata.
  blind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: '^0.14.0'

      - name: Download fonts
        run: ./fonts/download-fonts.sh

      - name: Configure the blind version
        run: |
          sed -i 's/^#let blind = false/#let blind = true/' template/main.typ
          grep -q '^#let blind = true' template/main.typ

      - name: Compile thesis
        run: typst compile template/main.typ thesis.pdf --root . --font-path ./fonts

      - name: Check the blind version is anonymous
        run: |
          command -v pdftotext > /dev/null || sudo apt-get install -y -qq poppler-utils
          pdftotext thesis.pdf thesis.txt
          # The cover's subtitle proves the text extraction works, so a clean result is real.
          grep -qF 模板排版功能示例 thesis.txt || { echo "::error::pdftotext did not extract the cover text."; exit 1; }
          for s in 张同舟 2654321 李共济 感谢指导老师在课题选定; do
            if grep -qF "$s" thesis.txt; then echo "::error::The blind PDF contains $s."; exit 1; fi
          done
          author=$(pdfinfo thesis.pdf | sed -n 's/^Author: *//p')
          if [ -n "$author" ]; then echo "::error::The blind PDF names an author: $author"; exit 1; fi
          echo "The blind PDF names no student, advisor or author."

  # Builds the package that publish.yml pushes to the `package` branch, creates
  # a project from it with `typst init` and compiles that project, the way a
  # Typst Universe user starts a thesis.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: '^0.14.0'

      - name: Download fonts
        run: ./fonts/download-fonts.sh

      - name: Build the package
        run: .github/bin/package_release.sh

      # The same `git add` as publish.yml, so the tree compiled here is the
      # tree the package branch would get.
      - name: Compile a project created from the package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' typst.toml)
          packages="$RUNNER_TEMP/packages"
          mkdir -p "$packages/preview/modern-tongji-thesis/$version"
          git add -A
          git add -f thumbnail.png
          git archive "$(git write-tree)" | tar -x -C "$packages/preview/modern-tongji-thesis/$version"
          typst init "@preview/modern-tongji-thesis:$version" "$RUNNER_TEMP/project" --package-path "$packages"
          typst compile "$RUNNER_TEMP/project/main.typ" --package-path "$packages" --font-path ./fonts

      - name: Upload the thumbnail
        uses: actions/upload-artifact@v7
        with:
          name: thumbnail
          path: thumbnail.png
          retention-days: 30

  test-summary:
    runs-on: ubuntu-latest
    needs: [build, fonts-windows, blind, package]
    if: always()
    steps:
      - name: Check builds succeeded
        env:
          BUILD: ${{ needs.build.result }}
          FONTS: ${{ needs.fonts-windows.result }}
          BLIND: ${{ needs.blind.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          echo "Build: $BUILD, fonts-windows: $FONTS, blind: $BLIND, package: $PACKAGE"
          if [[ "$BUILD" != "success" || "$FONTS" != "success" || "$BLIND" != "success" || "$PACKAGE" != "success" ]]; then
            echo "Build failed"
            exit 1
          fi
          echo "All builds completed successfully"

  collect-pdfs:
    runs-on: ubuntu-latest
    needs: build
    if: always() && !cancelled()
    steps:
      - name: Download all PDF artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: document-*
          merge-multiple: true

      - name: List downloaded files
        run: ls -la ./*.pdf

      - name: Upload consolidated PDFs
        uses: actions/upload-artifact@v7
        with:
          name: all-compiled-documents
          path: '*.pdf'
          retention-days: 90
