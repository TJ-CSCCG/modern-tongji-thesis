name: Publish

# Runs when a maintainer publishes the draft release that release-please.yml
# creates on merging its release PR. Builds the science and humanities PDFs and
# the source tarball from the release tag and attaches them to that release,
# then rebuilds the `package` branch, the tree the Typst Universe submission is
# copied from. A manual run does the same for the release of the tag it names.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the assets to, e.g. v0.2.1
        required: true

permissions: {}

# One run at a time: every run force-pushes the same `package` branch.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  pdf:
    strategy:
      fail-fast: false
      matrix:
        field: [science, humanities]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - name: Setup Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: '^0.14.0'

      - name: Download fonts
        run: ./fonts/download-fonts.sh

      - name: Configure humanities variant
        if: matrix.field == 'humanities'
        run: |
          sed -i 's/^#let field = "science"/#let field = "humanities"/' template/main.typ
          grep -q '^#let field = "humanities"' template/main.typ

      - name: Compile and attach the PDF
        env:
          FIELD: ${{ matrix.field }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pdf="modern-tongji-thesis-${TAG}-${FIELD}.pdf"
          typst compile template/main.typ "$pdf" --root . --font-path ./fonts
          gh release upload "$TAG" "$pdf" --clobber

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag names the version in typst.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' typst.toml)
          if [ "v${version}" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version ${version} in typst.toml."
            exit 1
          fi

      - name: Attach the source tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball="modern-tongji-thesis-${TAG}.tar.gz"
          git archive --format=tar.gz --output="$tarball" HEAD
          gh release upload "$TAG" "$tarball" --clobber

      - name: Setup Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: '^0.14.0'

      - name: Download fonts
        run: ./fonts/download-fonts.sh

      - name: Build the package
        run: .github/bin/package_release.sh

      # thumbnail.png is a build output, ignored on main; the package branch is
      # where it is committed, rendered from this tag.
      - name: Push the package branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add -A
          git add -f thumbnail.png
          git commit -m "chore: package ${TAG} for Typst Universe"
          git push --force origin HEAD:refs/heads/package
